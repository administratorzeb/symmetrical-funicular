<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu Block Blast</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #004080;
      color: white;
      padding: 20px;
    }
    #gameArea {
      display: grid;
      grid-template-columns: repeat(10, 40px);
      grid-template-rows: repeat(10, 40px);
      gap: 2px;
      margin: 20px auto;
      width: 420px;
      background: #ddd;
      border: 2px solid #004080;
    }
    .cell {
      width: 40px;
      height: 40px;
      background: white;
    }
    .filled {
      background: #ff4444;
    }
    #score, #bestScore, #message {
      font-size: 20px;
      margin-top: 10px;
      color: #004080;
    }
    #blocks {
      margin-top: 20px;
    }
    .block {
      display: inline-block;
      margin: 10px;
      cursor: pointer;
    }
    .block div {
      width: 20px;
      height: 20px;
      background: #004080;
      margin: 2px;
      display: inline-block;
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      background: #004080;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0066cc;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jeu Block Blast</h1>
    <p>Place les blocs pour remplir des lignes et gagner des points !</p>
  </header>

  <div id="gameArea"></div>

  <div id="score">Score : 0</div>
  <div id="bestScore">Meilleur score : 0</div>
  <div id="message"></div>
  <button onclick="startGame()">Rejouer</button>

  <div id="blocks"></div>

  <script>
    const gameArea = document.getElementById("gameArea");
    const scoreDisplay = document.getElementById("score");
    const bestScoreDisplay = document.getElementById("bestScore");
    const messageDisplay = document.getElementById("message");
    const blocksContainer = document.getElementById("blocks");

    let grid = [];
    let score = 0;
    let bestScore = 0;

    function createGrid() {
      gameArea.innerHTML = "";
      grid = [];
      for (let i = 0; i < 100; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        gameArea.appendChild(cell);
        grid.push(cell);
      }
    }

    function randomBlock() {
      // Exemple de blocs simples
      const shapes = [
        [[1,1,1]], // ligne horizontale
        [[1],[1],[1]], // ligne verticale
        [[1,1],[1,1]], // carré
        [[1,1,0],[0,1,1]] // forme L
      ];
      return shapes[Math.floor(Math.random() * shapes.length)];
    }

    function renderBlocks() {
      blocksContainer.innerHTML = "";
      for (let i = 0; i < 3; i++) {
        const blockShape = randomBlock();
        const blockDiv = document.createElement("div");
        blockDiv.classList.add("block");
        blockShape.forEach(row => {
          row.forEach(cell => {
            const c = document.createElement("div");
            if (cell === 1) c.style.background = "#ff4444";
            else c.style.background = "transparent";
            blockDiv.appendChild(c);
          });
          const br = document.createElement("br");
          blockDiv.appendChild(br);
        });
        blockDiv.addEventListener("click", () => placeBlock(blockShape));
        blocksContainer.appendChild(blockDiv);
      }
    }

    function placeBlock(shape) {
      // simplification : place toujours en haut à gauche
      let canPlace = true;
      let index = 0;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          if (shape[r][c] === 1) {
            if (grid[index].classList.contains("filled")) {
              canPlace = false;
            }
          }
          index++;
        }
      }
      if (canPlace) {
        index = 0;
        for (let r = 0; r < shape.length; r++) {
          for (let c = 0; c < shape[r].length; c++) {
            if (shape[r][c] === 1) {
              grid[index].classList.add("filled");
            }
            index++;
          }
        }
        score += 10;
        scoreDisplay.textContent = "Score : " + score;
        checkLines();
        renderBlocks();
      } else {
        messageDisplay.textContent = "Impossible de placer ce bloc ici.";
      }
    }

    function checkLines() {
      // Vérifie les lignes complètes
      for (let r = 0; r < 10; r++) {
        let full = true;
        for (let c = 0; c < 10; c++) {
          if (!grid[r*10 + c].classList.contains("filled")) {
            full = false;
          }
        }
        if (full) {
          for (let c = 0; c < 10; c++) {
            grid[r*10 + c].classList.remove("filled");
          }
          score += 50;
          scoreDisplay.textContent = "Score : " + score;
        }
      }
      // Vérifie les colonnes complètes
      for (let c = 0; c < 10; c++) {
        let full = true;
        for (let r = 0; r < 10; r++) {
          if (!grid[r*10 + c].classList.contains("filled")) {
            full = false;
          }
        }
        if (full) {
          for (let r = 0; r < 10; r++) {
            grid[r*10 + c].classList.remove("filled");
          }
          score += 50;
          scoreDisplay.textContent = "Score : " + score;
        }
      }
      if (score > bestScore) {
        bestScore = score;
        bestScoreDisplay.textContent = "Meilleur score : " + bestScore;
      }
    }

    function startGame() {
      score = 0;
      scoreDisplay.textContent = "Score : " + score;
      messageDisplay.textContent = "";
      createGrid();
      renderBlocks();
    }

    window.onload = startGame;
  </script>
</body>
</html>
